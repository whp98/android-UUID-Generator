name: Android CI RELEASE

# 触发器
on:
  push:
    tags:
      - v*
  pull_request:
    tags:
      - v*

jobs:
  build:

    runs-on: ubuntu-latest
    # 设置jdk环境为1.8
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0
      - name: set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      # 获取打包秘钥
      - name: Checkout Android Keystore
        uses: actions/checkout@v4
        with:
          repository: whp98/SignKey
          ref: main
          token: ${{ secrets.TOKEN }} # 连接仓库的token,需要单独配置
          path: androidSign # 仓库的根目录名
      # 使用tag号刷新versionName（保留仓库维护的versionCode，由Gradle打包时自动+1并写回version.properties）
      - name: Update versionName in version.properties
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == v* ]]; then
            sed -i "s/^versionName=.*/versionName=${TAG}/" ./version.properties
          fi
          cat ./version.properties
      # 打包release（Gradle会自动将versionCode+1并写回./version.properties）
      - name: Build with Gradle
        run: bash ./gradlew clean assembleRelease bundleRelease
      # 将自增后的version.properties提交回仓库维护
      - name: Commit and Push Updated version.properties
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          UPDATED_VERSION_FILE=$(cat ./version.properties)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          printf "%s\n" "$UPDATED_VERSION_FILE" > ./version.properties
          git add ./version.properties
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version in version.properties [skip ci]"
            git push origin main
          fi
      - name: Test1
        run: ls -l app/build/outputs/apk/release/
      - name: Test2
        run: ls -l app/build/outputs/bundle/release/
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          token: ${{ secrets.TOKEN }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
      # 存档打包的文件
      - name: Archive Build Folder
        uses: actions/upload-artifact@v4
        with:
          # Name of the artifact to upload.
          # Optional. Default is 'artifact'
          name: build
          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: app/build/
          # The desired behavior if no files are found using the provided path.
          # Available Options:
          #   warn: Output a warning but do not fail the action
          #   error: Fail the action with an error message
          #   ignore: Do not output any warnings or errors, the action does not fail
          # Optional. Default is 'warn'
          if-no-files-found: warn

          # Duration after which artifact will expire in days. 0 means using default retention.
          # Minimum 1 day.
          # Maximum 90 days unless changed from the repository settings page.
          # Optional. Defaults to repository settings.
          retention-days: 90
          # The level of compression for Zlib to be applied to the artifact archive.
          # The value can range from 0 to 9.
          # For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
          # Optional. Default is '6'
          compression-level: 6
          # If true, an artifact with a matching name will be deleted before a new one is uploaded.
          # If false, the action will fail if an artifact for the given name already exists.
          # Does not fail if the artifact does not exist.
          # Optional. Default is 'false'
          overwrite: false
          # Whether to include hidden files in the provided path in the artifact
          # The file contents of any hidden files in the path should be validated before
          # enabled this to avoid uploading sensitive information.
          # Optional. Default is 'false'
          include-hidden-files: false